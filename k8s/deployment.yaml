apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-crud-app
  namespace: crud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-crud
  template:
    metadata:
      labels:
        app: java-crud
    spec:
      containers:
      - name: java-crud
        image: 192.168.1.4:5000/repository/vahan-docker/java-crud-webapp:10
        ports:
        - containerPort: 8080
